# The browser build: the engine compiled to WebAssembly behind a tiny C ABI.
#
# Its own workspace on purpose, like `trainer/`: a cdylib crate-type in the
# engine's own manifest would make every native build emit a DLL as well.
#
#   rustup target add wasm32-unknown-unknown
#   cargo build --release --target wasm32-unknown-unknown   # from this directory
[workspace]

[package]
name = "nexus-web"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
nexus = { path = ".." }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
