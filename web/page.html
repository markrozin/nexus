<title>Nexus Chess</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;600;800&family=Chivo+Mono:wght@400;600&display=swap">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f6f9fd;
    --ink: #12243a;
    --muted: #5a6b80;
    --line: #d7e1ee;
    --light-square: #e9eff8;
    --dark-square: #6f8fb8;
    --signal: #1d4e89;
    --brass: #e8c66a;
    --shadow: 0 1px 2px rgba(18, 36, 58, .07), 0 8px 22px rgba(18, 36, 58, .07);
  }

  /* One deliberate look: white ground, blue board. The page paints every
     colour explicitly, so it holds on a light or dark host. */

  [hidden] { display: none !important; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Chivo", ui-sans-serif, system-ui, sans-serif;
    line-height: 1.5;
    padding-inline: 20px;
    padding-block: 18px 24px;
  }

  .wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .wordmark {
    font-family: "Chivo Mono", ui-monospace, monospace;
    font-weight: 600; font-size: 1.45rem; letter-spacing: .22em; text-transform: uppercase;
    margin: 0;
  }

  .game {
    display: grid; grid-template-columns: auto 280px; justify-content: center;
    gap: 24px; align-items: start;
  }
  @media (max-width: 820px) { .game { grid-template-columns: minmax(0, 1fr); } }

  .board-area {
    /* The board takes whatever height the window has left after the title and
       page padding, and never more than its column's width. */
    width: clamp(260px, min(calc(100vh - 96px), calc(100vw - 332px)), 1000px);
  }
  @media (max-width: 820px) {
    .board-area { width: min(100%, calc(100vh - 96px)); margin-inline: auto; }
  }

  .board {
    /* Rows must be declared as well as columns: with columns alone each row
       sizes to its contents, so ranks holding pieces grow and empty ranks
       collapse. Eight equal rows in a square box give 64 equal squares. */
    display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
    aspect-ratio: 1; container-type: inline-size;
    border: 1px solid var(--line); border-radius: 6px; overflow: hidden; box-shadow: var(--shadow);
    touch-action: manipulation;
  }
  .sq {
    position: relative; display: flex; align-items: center; justify-content: center;
    border: 0; padding: 0; cursor: pointer; background: var(--light-square);
    min-width: 0; min-height: 0;
  }
  .sq.dark { background: var(--dark-square); }
  .sq:disabled { cursor: default; }
  .sq:focus-visible { outline: 2px solid var(--signal); outline-offset: -3px; }
  /* Pieces are SVG drawings, each centred in its own square box, so they sit
     dead centre whatever fonts the visitor has. Images are set from PIECES. */
  .piece {
    pointer-events: none; position: absolute; inset: 0;
    background: center / 100% 100% no-repeat;
  }
  .sq.last::after {
    content: ""; position: absolute; inset: 0; background: var(--brass); opacity: .26; pointer-events: none;
  }
  .sq.selected::after {
    content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 3px var(--signal); pointer-events: none;
  }
  .sq .hint {
    position: absolute; width: 26%; height: 26%; border-radius: 50%;
    background: var(--signal); opacity: .5; pointer-events: none;
  }
  .sq .hint.capture { width: 82%; height: 82%; border-radius: 50%; background: none; box-shadow: inset 0 0 0 4px var(--signal); opacity: .55; }
  .sq .coord {
    position: absolute; font-family: "Chivo Mono", ui-monospace, monospace; font-size: max(9px, 1.5cqw);
    color: var(--ink); opacity: .45; pointer-events: none;
  }
  .sq .coord.file { right: 3px; bottom: 1px; }
  .sq .coord.rank { left: 3px; top: 1px; }

  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 16px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow);
  }

  .status { display: flex; flex-direction: column; gap: 4px; }
  .status .turn { font-weight: 600; font-size: 1.02rem; }
  .status .detail { color: var(--muted); font-size: .86rem; min-height: 1.3em; }

  .label {
    font-family: "Chivo Mono", ui-monospace, monospace; font-size: .64rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted);
  }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }
  button.action, select {
    font: inherit; font-size: .88rem; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 11px; cursor: pointer;
  }
  button.action:hover:not(:disabled), select:hover { border-color: var(--signal); }
  button.action:disabled { opacity: .5; cursor: default; }
  .field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 130px; }

  .moves { border-top: 1px solid var(--line); padding-top: 12px; }
  .moves ol {
    margin: 0; padding: 0; list-style: none; max-height: 150px; overflow-y: auto;
    font-family: "Chivo Mono", ui-monospace, monospace; font-size: .82rem;
    display: grid; grid-template-columns: 2.4rem 1fr 1fr; gap: 2px 8px; align-content: start;
  }
  .moves .num { color: var(--muted); }
  .moves .ply.engine { color: var(--signal); }
  .moves .empty { grid-column: 1 / -1; color: var(--muted); font-family: "Chivo", sans-serif; }

  .promo { display: flex; gap: 6px; align-items: center; }
  .promo button { position: relative; width: 44px; height: 44px; padding: 0; }


  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1 class="wordmark">Nexus</h1>
  </header>

  <div class="game">
    <div class="board-area">
      <div class="board" id="board" role="grid" aria-label="Chess board"></div>
    </div>

    <div class="panel">
      <div class="status">
        <div class="turn" id="turn">Your move</div>
        <div class="detail" id="detail"></div>
      </div>

      <div class="controls">
        <div class="field">
          <label class="label" for="side">You play</label>
          <select id="side">
            <option value="w" selected>White</option>
            <option value="b">Black</option>
          </select>
        </div>
      </div>

      <div class="controls">
        <button class="action" id="new">New game</button>
        <button class="action" id="undo">Take back</button>
        <button class="action" id="flip">Flip board</button>
      </div>

      <div class="promo" id="promo" hidden>
        <span class="label">Promote to</span>
        <button class="action" data-promo="q" aria-label="Queen"></button>
        <button class="action" data-promo="r" aria-label="Rook"></button>
        <button class="action" data-promo="b" aria-label="Bishop"></button>
        <button class="action" data-promo="n" aria-label="Knight"></button>
      </div>

      <div class="moves">
        <span class="label">Moves</span>
        <ol id="movelist"><li class="empty">No moves yet.</li></ol>
      </div>
    </div>
  </div>

</div>

<script>

    bb: "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"45\" height=\"45\" viewBox=\"0 0 45 45\"><g fill=\"none\" fill-rule=\"evenodd\" stroke=\"#000\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\"><g fill=\"#000\" stroke-linecap=\"butt\"><path d=\"M9 36c3.4-1 10.1.4 13.5-2 3.4 2.4 10.1 1 13.5 2 0 0 1.6.5 3 2-.7 1-1.6 1-3 .5-3.4-1-10.1.5-13.5-1-3.4 1.5-10.1 0-13.5 1-1.4.5-2.3.5-3-.5 1.4-2 3-2 3-2z\"/><path d=\"M15 32c2.5 2.5 12.5 2.5 15 0 .5-1.5 0-2 0-2 0-2.5-2.5-4-2.5-4 5.5-1.5 6-11.5-5-15.5-11 4-10.5 14-5 15.5 0 0-2.5 1.5-2.5 4 0 0-.5.5 0 2z\"/><path d=\"M25 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 1 1 5 0z\"/></g><path stroke=\"#ececec\" stroke-linejoin=\"miter\" d=\"M17.5 26h10M15 30h15m-7.5-14.5v5M20 18h5\"/></g></svg>",

  const PIECE_IMAGE = {};
  for (const [key, svg] of Object.entries(PIECES)) {
    PIECE_IMAGE[key] = 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';
  }
  const START = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";

  const el = {
    board: document.getElementById("board"),
    turn: document.getElementById("turn"),
    detail: document.getElementById("detail"),
    side: document.getElementById("side"),
    newGame: document.getElementById("new"),
    undo: document.getElementById("undo"),
    flip: document.getElementById("flip"),
    promo: document.getElementById("promo"),
    movelist: document.getElementById("movelist")
  };

  function pieceElement(color, type) {
    const span = document.createElement("span");
    span.className = "piece";
    span.style.backgroundImage = PIECE_IMAGE[color + type];
    return span;
  }

  const state = {
    fen: START,
    history: [],
    playerColor: "w",
    orientation: "w",
    selected: null,
    targets: [],
    pending: null,
    thinking: false,
    lastMove: null
  };

  // --- WebAssembly glue -----------------------------------------------------
  let api = null;
  const encoder = new TextEncoder();
  const decoder = new TextDecoder();
  let outPtr = 0;
  const OUT_CAPACITY = 8192;

  function bytes() {
    return new Uint8Array(api.memory.buffer);
  }

  function pushString(text) {
    const encoded = encoder.encode(text);
    const ptr = api.alloc(encoded.length);
    bytes().set(encoded, ptr);
    return { ptr, len: encoded.length };
  }

  function readOut(written) {
    if (written < 0) return null;
    return decoder.decode(bytes().subarray(outPtr, outPtr + written));
  }

  function legalMoves(fen) {
    const f = pushString(fen);
    const written = api.legal_moves(f.ptr, f.len, outPtr, OUT_CAPACITY);
    api.dealloc(f.ptr, f.len);
    const text = readOut(written);
    return text ? text.split(" ").filter(Boolean) : [];
  }

  function applyMove(fen, move) {
    const f = pushString(fen);
    const m = pushString(move);
    const written = api.apply_move(f.ptr, f.len, m.ptr, m.len, outPtr, OUT_CAPACITY);
    const result = readOut(written);
    api.dealloc(f.ptr, f.len);
    api.dealloc(m.ptr, m.len);
    return result;
  }

  function statusOf(fen) {
    const f = pushString(fen);
    const written = api.status(f.ptr, f.len, outPtr, OUT_CAPACITY);
    api.dealloc(f.ptr, f.len);
    return readOut(written) || "ok";
  }

  function search(fen, nodes) {
    const f = pushString(fen);
    const written = api.best_move(f.ptr, f.len, BigInt(nodes), outPtr, OUT_CAPACITY);
    api.dealloc(f.ptr, f.len);
    const text = readOut(written);
    // The engine also reports score, depth and nodes; only the move is shown.
    return text ? text.split(" ")[0] : null;
  }

  async function boot() {
    const binary = Uint8Array.from(atob(WASM_BASE64), (c) => c.charCodeAt(0));
    const { instance } = await WebAssembly.instantiate(binary, {});
    api = instance.exports;
    outPtr = api.alloc(OUT_CAPACITY);
    newGame();
  }

  // --- Position helpers -----------------------------------------------------
  function boardFromFen(fen) {
    const rows = fen.split(" ")[0].split("/");
    const squares = {};
    rows.forEach((row, rankIndex) => {
      let file = 0;
      for (const ch of row) {
        if (ch >= "1" && ch <= "8") {
          file += Number(ch);
          continue;
        }
        const name = "abcdefgh"[file] + (8 - rankIndex);
        squares[name] = { type: ch.toLowerCase(), color: ch === ch.toUpperCase() ? "w" : "b" };
        file += 1;
      }
    });
    return squares;
  }

  const sideToMove = (fen) => fen.split(" ")[1];

  // --- Rendering ------------------------------------------------------------
  function render() {
    const squares = boardFromFen(state.fen);
    const files = state.orientation === "w" ? "abcdefgh".split("") : "hgfedcba".split("");
    const ranks = state.orientation === "w" ? [8, 7, 6, 5, 4, 3, 2, 1] : [1, 2, 3, 4, 5, 6, 7, 8];

    el.board.replaceChildren();
    for (const rank of ranks) {
      for (const file of files) {
        const name = file + rank;
        const piece = squares[name];
        const dark = ("abcdefgh".indexOf(file) + rank) % 2 === 1;
        const square = document.createElement("button");
        square.className = "sq" + (dark ? " dark" : "");
        square.dataset.square = name;
        square.setAttribute("aria-label", name + (piece ? ", " + piece.color + piece.type : ", empty"));

        if (state.selected === name) square.classList.add("selected");
        if (state.lastMove && (state.lastMove.slice(0, 2) === name || state.lastMove.slice(2, 4) === name)) {
          square.classList.add("last");
        }
        if (piece) square.append(pieceElement(piece.color, piece.type));
        if (state.targets.includes(name)) {
          const hint = document.createElement("span");
          hint.className = "hint" + (piece ? " capture" : "");
          square.append(hint);
        }
        if (rank === ranks[ranks.length - 1]) {
          const coord = document.createElement("span");
          coord.className = "coord file";
          coord.textContent = file;
          square.append(coord);
        }
        if (file === files[0]) {
          const coord = document.createElement("span");
          coord.className = "coord rank";
          coord.textContent = rank;
          square.append(coord);
        }
        square.disabled = state.thinking;
        el.board.append(square);
      }
    }

    el.undo.disabled = state.history.length < 2 || state.thinking;
    renderMoves();
  }

  function renderMoves() {
    el.movelist.replaceChildren();
    if (state.history.length === 0) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = "No moves yet.";
      el.movelist.append(empty);
      return;
    }
    for (let i = 0; i < state.history.length; i += 2) {
      const num = document.createElement("li");
      num.className = "num";
      num.textContent = (i / 2 + 1) + ".";
      el.movelist.append(num);
      for (const entry of [state.history[i], state.history[i + 1]]) {
        const cell = document.createElement("li");
        cell.className = "ply" + (entry && entry.byEngine ? " engine" : "");
        cell.textContent = entry ? entry.move : "";
        el.movelist.append(cell);
      }
    }
    el.movelist.scrollTop = el.movelist.scrollHeight;
  }

  function setStatus(turn, detail) {
    el.turn.textContent = turn;
    el.detail.textContent = detail;
  }

  // --- Game flow ------------------------------------------------------------
  function newGame() {
    state.fen = START;
    state.history = [];
    state.selected = null;
    state.targets = [];
    state.lastMove = null;
    state.thinking = false;
    state.playerColor = el.side.value;
    state.orientation = state.playerColor;
    el.promo.hidden = true;
    state.pending = null;
    for (const button of el.promo.querySelectorAll("[data-promo]")) {
      button.replaceChildren(pieceElement(state.playerColor, button.dataset.promo));
    }
    setStatus("Your move", state.playerColor === "w" ? "" : "Nexus plays first.");
    render();
    if (sideToMove(state.fen) !== state.playerColor) engineTurn();
  }

  function finished(status) {
    const loser = sideToMove(state.fen) === "w" ? "White" : "Black";
    if (status === "checkmate") {
      const youWon = sideToMove(state.fen) !== state.playerColor;
      setStatus(youWon ? "You win" : "Nexus wins", "Checkmate — " + loser + " has no legal move.");
      return true;
    }
    if (status === "stalemate") {
      setStatus("Draw", "Stalemate — " + loser + " has no legal move and is not in check.");
      return true;
    }
    if (status === "insufficient") {
      setStatus("Draw", "Neither side has enough material to mate.");
      return true;
    }
    if (status === "fifty") {
      setStatus("Draw", "Fifty moves without a capture or a pawn move.");
      return true;
    }
    return false;
  }

  function play(move, byEngine) {
    const next = applyMove(state.fen, move);
    if (!next) return false;
    state.history.push({ move, byEngine });
    state.fen = next;
    state.lastMove = move;
    state.selected = null;
    state.targets = [];
    return true;
  }

  function afterMove() {
    const status = statusOf(state.fen);
    render();
    if (finished(status)) return;
    if (sideToMove(state.fen) === state.playerColor) {
      setStatus("Your move", status === "check" ? "You are in check." : "Nexus is waiting.");
    } else {
      engineTurn(status === "check");
    }
  }

  function engineTurn(inCheck) {
    state.thinking = true;
    setStatus("Nexus is thinking", inCheck ? "It is in check." : "");
    render();
    // Yield first so the board repaints with the player's move before the
    // search blocks this thread.
    setTimeout(() => {
      const move = search(state.fen, NODES);
      state.thinking = false;
      if (!move || move === "0000") {
        render();
        return;
      }
      play(move, true);
      const status = statusOf(state.fen);
      render();
      if (finished(status)) return;
      setStatus("Your move", "Nexus played " + move + (status === "check" ? ". You are in check." : "."));
    }, 30);
  }

  function selectSquare(name) {
    if (state.thinking) return;
    if (sideToMove(state.fen) !== state.playerColor) return;

    if (state.selected) {
      const candidates = legalMoves(state.fen).filter(
        (m) => m.slice(0, 2) === state.selected && m.slice(2, 4) === name
      );
      if (candidates.length === 1) {
        play(candidates[0], false);
        afterMove();
        return;
      }
      if (candidates.length > 1) {
        state.pending = { from: state.selected, to: name };
        el.promo.hidden = false;
        setStatus("Choose a piece", "Your pawn reaches the last rank.");
        return;
      }
    }

    const moves = legalMoves(state.fen).filter((m) => m.slice(0, 2) === name);
    state.selected = moves.length ? name : null;
    state.targets = moves.map((m) => m.slice(2, 4));
    render();
  }

  el.board.addEventListener("click", (event) => {
    const square = event.target.closest(".sq");
    if (square) selectSquare(square.dataset.square);
  });

  el.promo.addEventListener("click", (event) => {
    const choice = event.target.closest("[data-promo]");
    if (!choice || !state.pending) return;
    const move = state.pending.from + state.pending.to + choice.dataset.promo;
    el.promo.hidden = true;
    state.pending = null;
    if (play(move, false)) afterMove();
  });

  el.newGame.addEventListener("click", newGame);
  el.side.addEventListener("change", newGame);
  el.flip.addEventListener("click", () => {
    state.orientation = state.orientation === "w" ? "b" : "w";
    render();
  });
  el.undo.addEventListener("click", () => {
    if (state.thinking || state.history.length < 2) return;
    // Both plies, so it is the player's move again.
    state.history.splice(-2);
    state.fen = START;
    for (const entry of state.history) state.fen = applyMove(state.fen, entry.move);
    state.lastMove = state.history.length ? state.history[state.history.length - 1].move : null;
    state.selected = null;
    state.targets = [];
    setStatus("Your move", "Took back a move.");
    render();
  });

  boot().catch((error) => {
    setStatus("Nexus could not start", String(error));
  });
</script>
